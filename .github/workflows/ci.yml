name: CI

# MEASUREMENT ONLY - do not merge.
# Measures the Lint lane on the hosted Linux runner with one ShellCheck worker
# against two, three repetitions each, with the whole-machine memory trace
# streaming to the log so a run that is shut down still leaves its curve.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  measure:
    name: Lint workers ${{ matrix.jobs }} rep ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        jobs: [1, 2]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint with whole-machine memory trace
        env:
          FM_LINT_JOBS: ${{ matrix.jobs }}
        run: |
          set -u
          [ -x /usr/bin/time ] || { sudo apt-get update -qq && sudo apt-get install -y -qq time; }
          uname -a
          grep -E '^(MemTotal|SwapTotal):' /proc/meminfo
          nproc
          bin/fm-mem-trace.sh --interval 5 | tee "$RUNNER_TEMP/trace.log" &
          start=$(date +%s)
          rc=0
          bin/fm-lint.sh --telemetry "$RUNNER_TEMP/telemetry.tsv" > "$RUNNER_TEMP/lint.out" 2>&1 || rc=$?
          end=$(date +%s)
          pkill -f fm-mem-trace.sh || true
          sleep 1
          tail -n 20 "$RUNNER_TEMP/lint.out"
          echo "probe: jobs=$FM_LINT_JOBS lint_exit=$rc lint_wall_s=$((end - start))"
          cat "$RUNNER_TEMP/telemetry.tsv" || true
          awk '
            $1 == "fm-mem" {
              n++
              if (min_avail == "" || $3 < min_avail) min_avail = $3
              if (min_swap == "" || $6 < min_swap) min_swap = $6
              if ($9 > max_procs) max_procs = $9
              if ($11 > max_hwm) max_hwm = $11
              if ($12 > max_sum) max_sum = $12
            }
            END {
              printf "probe_summary: samples=%d min_mem_avail_mib=%s min_swap_free_mib=%s max_shellcheck_procs=%s max_single_hwm_mib=%s max_concurrent_rss_sum_mib=%s\n", n, min_avail, min_swap, max_procs, max_hwm, max_sum
            }
          ' "$RUNNER_TEMP/trace.log"
          exit "$rc"
