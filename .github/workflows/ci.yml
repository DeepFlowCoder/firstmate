name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# THROWAWAY MEASUREMENT BRANCH. Do not merge this file.
# Which ShellCheck lever drives the two pathological roots' peak RSS.
jobs:
  lint:
    name: Lint ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, no-extended, no-external, neither]
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Profile the expensive roots under one lever setting
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -eu
          case "$MODE" in
            baseline)    args="--norc --external-sources" ;;
            no-extended) args="--norc --external-sources --extended-analysis=false" ;;
            no-external) args="--norc" ;;
            neither)     args="--norc --extended-analysis=false" ;;
          esac
          echo "mode=$MODE args=$args"
          for root in bin/fm-teardown.sh tests/fm-pending-reply.test.sh \
                      bin/fm-send.sh bin/fm-backlog-handoff.sh bin/fm-spawn.sh; do
            /usr/bin/time -f "peak=%M wall=%e" -o "$RUNNER_TEMP/t" \
              shellcheck $args -- "$root" >"$RUNNER_TEMP/out" 2>&1 || true
            awk -v r="$root" -v m="$MODE" '
              /peak=/ {
                split($1, a, "="); split($2, b, "=")
                printf "LEVER %s %.0f %s %s\n", m, a[2] / 1024, b[2], r
              }' "$RUNNER_TEMP/t"
          done
          echo "--- diagnostics count under $MODE for the two worst roots ---"
          for root in bin/fm-teardown.sh tests/fm-pending-reply.test.sh; do
            n=$(shellcheck $args --format=gcc -- "$root" 2>/dev/null | wc -l || true)
            echo "FINDINGS $MODE $n $root"
          done
