name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# THROWAWAY MEASUREMENT BRANCH. Do not merge this file.
# Per-root ShellCheck peak RSS across the whole canonical set, eight runners.
jobs:
  lint:
    name: Lint ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Profile every root in this shard on its own
        env:
          FM_LINT_SHARD: ${{ matrix.shard }}of${{ strategy.job-total }}
        run: |
          set -eu
          echo "machine_total_mib=$(awk '/^MemTotal:/{printf "%.0f", $2/1024}' /proc/meminfo)"
          bin/fm-lint.sh --list-files --shard "$FM_LINT_SHARD" > "$RUNNER_TEMP/roots"
          echo "shard_roots=$(wc -l < "$RUNNER_TEMP/roots")"
          while IFS= read -r root; do
            [ -n "$root" ] || continue
            /usr/bin/time -f "root_peak_mib=%M wall=%e" -o "$RUNNER_TEMP/t" \
              shellcheck --norc --external-sources -- "$root" >/dev/null 2>&1 || true
            # %M is KiB on GNU time; report MiB so the numbers compare directly
            # with the whole-machine trace.
            awk -v r="$root" '
              /root_peak_mib=/ {
                split($1, a, "="); split($2, b, "=")
                printf "ROOTCOST %.0f %s %s\n", a[2] / 1024, b[2], r
              }' "$RUNNER_TEMP/t"
          done < "$RUNNER_TEMP/roots"
