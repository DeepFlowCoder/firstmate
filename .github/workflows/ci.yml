name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# THROWAWAY MEASUREMENT BRANCH. Do not merge this file.
# Does bounding source analysis on the pathological roots put the lane inside
# the machine, and does it change any diagnostic?
jobs:
  lane:
    name: Lint lane under trace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the real lane under a whole-machine trace
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-mem"
          bin/fm-mem-trace.sh --interval 5 \
            --out "$RUNNER_TEMP/fm-mem/mem-trace.log" &
          trace_pid=$!
          rc=0
          bin/fm-lint.sh --telemetry "$RUNNER_TEMP/fm-mem/lint-telemetry.tsv" || rc=$?
          kill "$trace_pid" 2>/dev/null || true
          wait "$trace_pid" 2>/dev/null || true
          echo "lane_exit=$rc"
          exit "$rc"
      - name: Machine state after the lane
        if: always()
        run: |
          set -eu
          free -m
          cat /proc/pressure/memory || echo "no PSI"
          cat "$RUNNER_TEMP/fm-mem/lint-telemetry.tsv" 2>/dev/null || echo "no telemetry"

  profile:
    name: Bounded roots profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Peak and diagnostics for each bounded root, before against after
        run: |
          set -eu
          roots="bin/fm-teardown.sh tests/fm-pending-reply.test.sh bin/fm-send.sh
                 bin/fm-watch.sh bin/fm-backlog-handoff.sh tests/fm-remote-reply.test.sh
                 bin/fm-procevent-remote-reply.sh"
          # "before" is a real checkout of the merge base, not a copy of seven
          # files: a copied root would resolve none of its repo-relative source
          # directives and would measure as cheap for the wrong reason.
          base=$(git merge-base HEAD origin/main)
          echo "merge_base=$base"
          git worktree add --detach "$RUNNER_TEMP/before" "$base" >/dev/null
          for root in $roots; do
            /usr/bin/time -f "peak=%M wall=%e" -o "$RUNNER_TEMP/t" \
              shellcheck --norc --external-sources --format=gcc -- "$root" \
              >"$RUNNER_TEMP/after.diag" 2>/dev/null || true
            awk -v r="$root" '/peak=/ {split($1,a,"="); split($2,b,"=");
              printf "AFTER %.0f %s %s\n", a[2]/1024, b[2], r}' "$RUNNER_TEMP/t"
            echo "AFTER_DIAG $(wc -l < "$RUNNER_TEMP/after.diag") $root"
            sed 's/^/  after| /' "$RUNNER_TEMP/after.diag"
          done
          # Cheapest first: the two roots that cost more than the machine has
          # can take this runner down, and everything printed before that point
          # survives in the streamed log.
          echo "--- the same roots as they were before the boundary ---"
          cd "$RUNNER_TEMP/before"
          for root in bin/fm-procevent-remote-reply.sh tests/fm-remote-reply.test.sh \
                      bin/fm-backlog-handoff.sh bin/fm-send.sh bin/fm-watch.sh \
                      tests/fm-pending-reply.test.sh bin/fm-teardown.sh; do
            /usr/bin/time -f "peak=%M wall=%e" -o "$RUNNER_TEMP/t2" \
              shellcheck --norc --external-sources --format=gcc -- "$root" \
              >"$RUNNER_TEMP/before.diag" 2>/dev/null || true
            awk -v r="$root" '/peak=/ {split($1,a,"="); split($2,b,"=");
              printf "BEFORE %.0f %s %s\n", a[2]/1024, b[2], r}' "$RUNNER_TEMP/t2"
            echo "BEFORE_DIAG $(wc -l < "$RUNNER_TEMP/before.diag") $root"
            sed 's/^/  before| /' "$RUNNER_TEMP/before.diag"
          done
