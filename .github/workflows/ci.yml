name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# THROWAWAY MEASUREMENT BRANCH. Do not merge this file.
# Does bounding source analysis on the pathological roots put the lane inside
# the machine, and does it change any diagnostic?
jobs:
  lane:
    name: Lint lane under trace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the real lane under a whole-machine trace
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-mem"
          bin/fm-mem-trace.sh --interval 5 \
            --out "$RUNNER_TEMP/fm-mem/mem-trace.log" &
          trace_pid=$!
          rc=0
          bin/fm-lint.sh --telemetry "$RUNNER_TEMP/fm-mem/lint-telemetry.tsv" || rc=$?
          kill "$trace_pid" 2>/dev/null || true
          wait "$trace_pid" 2>/dev/null || true
          echo "lane_exit=$rc"
          exit "$rc"
      - name: Machine state after the lane
        if: always()
        run: |
          set -eu
          free -m
          cat /proc/pressure/memory || echo "no PSI"
          cat "$RUNNER_TEMP/fm-mem/lint-telemetry.tsv" 2>/dev/null || echo "no telemetry"

