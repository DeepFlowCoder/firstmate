name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # This lane used to lose runs to "The runner has received a shutdown signal"
  # (exit 143) and the earlier reading of that was that the runner was being
  # reclaimed out from under an innocent job, so the remedy was a fresh attempt:
  # jobs 99553610219 and 99558734177 both took the shutdown line and only the
  # third attempt, 99565342352, went green.
  #
  # Run 33471424345 settles it the other way. The Lint job (99741795200) took
  # the shutdown signal at 10m39s while all fifteen other jobs in that same run
  # went green. A reclaimed runner does not pick one job out of sixteen; the
  # job that dies is the job that eats the machine, and Lint is the only lane
  # here that holds gigabytes.
  #
  # So this lane runs one worker: bin/fm-lint.sh defaults FM_LINT_JOBS to 1 when
  # GITHUB_ACTIONS or CI is true, and to 2 everywhere else. Both orders lint the
  # same two shards and produce byte-identical diagnostics and the same verdict,
  # so the only thing that changes is what the run holds at once.
  #
  # ONE WORKER WAS NEVER WHAT MADE THIS LANE FIT, and for a long time it did not
  # fit at all. Measured on the runner rather than on macOS, a single ShellCheck
  # reached 7223 MiB on a runner with 7942 MiB of RAM, drained all 3072 MiB of
  # swap, and took the shutdown signal (run 34737337424). The whole of it was two
  # roots - bin/fm-teardown.sh alone cost 7407 MiB and
  # tests/fm-pending-reply.test.sh 7093 MiB, against a median root of 83 MiB - so
  # the defect reproduced by linting ONE file with these exact flags, with no
  # shards and no worker pool involved.
  #
  # Read the earlier macOS figures in this repo's history with that in mind: they
  # understated the runner's peak by more than half, and the reading that
  # concurrency was the only lever with a measured effect followed from them.
  # Splitting the roots across separate runners was measured and RULED OUT: an
  # eight-way split left two shards at 7175 and 7261 MiB, surviving on 134 and
  # 58 MiB of available memory, which relocates the failure instead of removing
  # it. With a single root above the machine's RAM, more runners cannot help.
  #
  # What the lane runs today is bounded at the source: the handful of roots whose
  # followed source graph made extended analysis explode now stop that analysis at
  # imported production modules, each of which is a canonical root of this same
  # run and is analysed on its own anyway. Same lane, same flags, same file set:
  # 2574 MiB peak against 7223, 4595 MiB still available against 91, swap never
  # touched, and a 464s wall against the 19-21 minutes a green run used to take.
  # docs/verification/lint-lane-memory.md owns the curves, the per-root table, the
  # flag comparison, the one-file reproduction, and the after numbers.
  #
  # Signal exits stay unambiguous either way: bin/fm-lint.sh installs its own
  # traps so HUP/INT/TERM leave as 129/130/143 with "interrupted ... no lint
  # verdict was reached" on stderr, while a real verdict is always 0, 1, or 2.
  # A reclaimed runner sends SIGTERM; the OOM killer and systemd-oomd send
  # SIGKILL, and a killed ShellCheck comes back as a worker status the parent
  # replays as a real verdict rather than as 143 - which is how run 33307176505,
  # job 99245658478 reported ShellCheck as "Killed". No in-step retry is encoded
  # here: a shutdown signal goes to the whole process group and kills the step's
  # wrapping `bash -e` before any retry branch could run, while it could re-run
  # a genuine 0/1/2 verdict into green.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Cap is a tripwire, not the expected end of the lane, and it has a lot of
    # room now: with the source boundary described above, this one-worker lane
    # measured a 464s wall, against the 19-21 minutes a green run took before it.
    # Read the older 15m03s-15m47s two-worker figures as history - they predate
    # that boundary. The cap stays 45: far above today's wall, and still far
    # short of the 6-hour GitHub default that let run 33353469575 sit 61 minutes
    # before reporting.
    #
    # WHAT THE 45 BOUNDS, because it is not what the number reads like: it bounds
    # the instant GitHub DECIDES to cancel, counted from the job's started_at. It
    # does not bound how long the job runs. The job ends when its termination
    # finishes, and that tail belongs to GitHub, not to this file. Measured tails:
    # 15-30s across thirteen cap hits whose runner could still answer; 5m01s,
    # twice, on probe runners taken away from GitHub deliberately; and 10m00s on
    # 2026-09-13, when job 103670890754 took the cancel at 45m0s and ended at
    # 55m00s with a ShellCheck holding the whole machine. So this lane's worst
    # measured COST is 55 minutes, not 45, the tail is not a constant, and no
    # number here can shorten it - only the decision. Budget this lane as cap
    # plus tail, and do not read a declared cap in this file as a wall.
    # docs/verification/ci-job-timeout-wall.md owns that measurement;
    # bin/fm-ci-timeout-overrun.sh finds a recurrence.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Single owner of the lint definition (shell file set, config, version,
      # and GitHub workflow lint). Do not re-spell the checks here; keep CI
      # and the pre-push gate on this script so a self-broken ci.yml still
      # fails locally before merge.
      - run: bin/fm-lint.sh

  # Deterministic proof that portable parallel shards + portable serial + Herdr
  # equal the complete tests/*.test.sh inventory with no missing or duplicates,
  # and that the portable serial CI shards partition that serial lane exactly.
  test-coverage:
    name: Test coverage guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prove complete regression partition
        run: bin/fm-test-run.sh --check-coverage

  # THE INTERPRETER FLOOR - why every suite lane below installs its own bash.
  #
  # These suites signal live processes constantly, and bash 5.2 can fail to
  # PARSE a signal trap's body when the signal is delivered while the shell is
  # inside a sourced function doing a command substitution. Bash then prints the
  # parse error and CARRIES ON rather than dying, so the handler never runs and
  # the signal is swallowed. A watcher that swallows its SIGTERM keeps this
  # step's output pipe open, and the lane produces nothing at all until the cap
  # cancels it - which reads as a cancelled job rather than as a failure anyone
  # can attribute.
  #
  # That is measured, not hypothetical. It cancelled portable-serial-2of8 on
  # PR 31 (2026-09-08, 18 minutes of silence after the error) and portable
  # serial shard 8 on PR 74 (2026-09-19, 18 minutes). Both printed exactly one
  # line first:
  #
  #   .../bin/fm-wake-lib.sh: trap: line 2: unexpected EOF while looking for matching `)'
  #
  # The file in that message is BASH_SOURCE[0] - whichever sourced function was
  # running when the signal landed - NOT the file that installed the trap, which
  # is why it names a library containing no trap at all. The trap is the
  # watcher's own and its body is `exit 1`; there is no unbalanced parenthesis
  # anywhere in this repo to close. The open parenthesis bash complains about is
  # its own parser state, leaking from a command substitution it was parsing
  # concurrently.
  #
  # Reproduced against the interpreter each version actually ships:
  # bash 5.2.21 (what ubuntu-latest still provides) produced the parse error in
  # 5 of 5 runs of 1500 delivered signals; bash 5.3.0 and 5.3.9 produced none in
  # 7500 and 6000. Raising the floor removes the race at its source rather than
  # bounding its damage. docs/verification/ci-bash-floor.md owns the harness, the
  # exact commands, the full output, and the accepted cost of no longer
  # exercising 5.2. tests/fm-ci-bash-floor.test.sh fails if a lane ever drops
  # back below the floor.
  #
  # Two duration-balanced portable parallel shards of the Phase 2 proven-isolated
  # set only. Composition owner: bin/fm-test-run.sh (docs/fm-test-portable-shards.md).
  tests-portable-parallel-1:
    name: Behavior portable parallel 1
    runs-on: ubuntu-latest
    # Measured shard wall is ~1 min of serial sum on proven scripts; this cap is
    # a hang tripwire with margin, not the expected healthy end of the lane.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Interpreter floor; see THE INTERPRETER FLOOR above. The install is a
      # no-op once the cache holds a binary at or above the pinned version.
      - name: Cache pinned bash
        uses: actions/cache@v4
        with:
          path: ~/.cache/fm-bash
          key: fm-bash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/fm-install-bash.sh') }}
      - name: Install pinned bash
        run: |
          set -eu
          bin/fm-install-bash.sh "$HOME/.cache/fm-bash/bin"
          echo "$HOME/.cache/fm-bash/bin" >> "$GITHUB_PATH"
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run portable parallel shard 1
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          bin/fm-test-run.sh --lane portable-parallel-1 \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-parallel-1.json"
      - name: Upload shard 1 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-parallel-1
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-parallel-1.json
          if-no-files-found: warn

  # Interpreter floor applies here too; see THE INTERPRETER FLOOR above.
  tests-portable-parallel-2:
    name: Behavior portable parallel 2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Interpreter floor; see THE INTERPRETER FLOOR above.
      - name: Cache pinned bash
        uses: actions/cache@v4
        with:
          path: ~/.cache/fm-bash
          key: fm-bash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/fm-install-bash.sh') }}
      - name: Install pinned bash
        run: |
          set -eu
          bin/fm-install-bash.sh "$HOME/.cache/fm-bash/bin"
          echo "$HOME/.cache/fm-bash/bin" >> "$GITHUB_PATH"
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run portable parallel shard 2
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          bin/fm-test-run.sh --lane portable-parallel-2 \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-parallel-2.json"
      - name: Upload shard 2 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-parallel-2
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-parallel-2.json
          if-no-files-found: warn

  # Required portable serial remainder: watcher, lock, AFK, tmux, daemon,
  # ambiguous, and other stateful tests. Real Herdr stays in tests-herdr.
  # Split across separate runners so no two of these stateful scripts ever share
  # a machine: each shard is still strictly serial in itself. Shard membership
  # and the shard count both belong to bin/fm-test-run.sh, which refuses a lane
  # whose "ofN" disagrees with it (docs/fm-test-portable-shards.md).
  tests-portable-serial:
    name: Behavior portable serial ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Cap is a hang tripwire, not the expected healthy end of the lane.
    #
    # Raised 15 -> 20 after shard 3 hit the old cap on run 33296163782: it ran
    # 15m18s and GitHub reported the timed-out job as CANCELLED, which reads as a
    # red lane rather than as a timeout. Every other job in that run passed, the
    # other seven shards between 6 and 7 minutes.
    #
    # The per-script cause on that shard is UNMEASURED, deliberately not guessed
    # at here: the run was cut before shard 3's timing artifact uploaded, so the
    # only artifacts are the seven that finished. The 15-minute cap came from
    # green run 33246490613, which predates the upstream reconciliation, and 13
    # scripts the merge brought in still carry PORTABLE_SERIAL_DEFAULT_WEIGHT_MS
    # rather than a measured hint, so the balanced estimate is known to be
    # optimistic. 20 minutes is upstream's own cap for this lane and restores
    # tripwire margin without pretending the balance is understood.
    #
    # The next green run uploads shard 3's artifact, which is what makes a real
    # wholesale refresh possible; docs/fm-test-portable-shards.md owns that
    # procedure and records the refresh as due.
    timeout-minutes: 20
    strategy:
      # Every shard reports so one failure never hides another shard's result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Interpreter floor; see THE INTERPRETER FLOOR above. This is the lane the
      # swallowed SIGTERM actually cancelled, twice, and the one whose per-script
      # runner streams through a pipe a survivor can hold open.
      - name: Cache pinned bash
        uses: actions/cache@v4
        with:
          path: ~/.cache/fm-bash
          key: fm-bash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/fm-install-bash.sh') }}
      - name: Install pinned bash
        run: |
          set -eu
          bin/fm-install-bash.sh "$HOME/.cache/fm-bash/bin"
          echo "$HOME/.cache/fm-bash/bin" >> "$GITHUB_PATH"
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux >/dev/null || {
            echo "::error::tmux is required for real afk injection e2e coverage"
            exit 1
          }
          tmux -V
      - name: Install tasks-axi for backlog-handoff delegation
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run portable serial shard ${{ matrix.shard }}
        env:
          # job-total rather than a literal, so shrinking or growing the matrix
          # without matching bin/fm-test-run.sh is refused instead of quietly
          # leaving a shard of the required lane unrun.
          FM_SERIAL_LANE: portable-serial-${{ matrix.shard }}of${{ strategy.job-total }}
          FM_SERIAL_SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          bin/fm-test-run.sh --lane "$FM_SERIAL_LANE" \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-serial-${FM_SERIAL_SHARD}.json"
      - name: Upload portable serial shard ${{ matrix.shard }} timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-serial-${{ matrix.shard }}
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-serial-${{ matrix.shard }}.json
          if-no-files-found: warn

  # Required real-Herdr lane: pinned install, serial real-herdr-gated family,
  # hard-fail on "skip: herdr not found". Starts on Linux x86_64; if a genuine
  # platform invariant fails (focus, cleanup, default-session tripwire), keep
  # the failure evidence and move the job to macOS rather than skip assertions.
  tests-herdr:
    name: Behavior tests (Herdr)
    runs-on: ubuntu-latest
    # Healthy runs finish around 7 minutes. This job cap is a last-resort hang
    # tripwire, not the expected end of the lane. The family-run step owns the
    # tighter bound so a wedged suite fails fast with always() cleanup and
    # timing artifacts still uploaded (docs/fm-test-portable-shards.md).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Interpreter floor; see THE INTERPRETER FLOOR above.
      - name: Cache pinned bash
        uses: actions/cache@v4
        with:
          path: ~/.cache/fm-bash
          key: fm-bash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/fm-install-bash.sh') }}
      - name: Install pinned bash
        run: |
          set -eu
          bin/fm-install-bash.sh "$HOME/.cache/fm-bash/bin"
          echo "$HOME/.cache/fm-bash/bin" >> "$GITHUB_PATH"
      - name: Require tools for real Herdr
        run: |
          set -eu
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }
          command -v python3 >/dev/null || { echo "::error::python3 is required"; exit 1; }
          command -v curl >/dev/null || { echo "::error::curl is required"; exit 1; }
          command -v tar >/dev/null || { echo "::error::tar is required"; exit 1; }
          jq --version
          python3 --version
      - name: Install pinned Herdr
        run: |
          set -eu
          bin/fm-install-herdr.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned Treehouse
        run: |
          set -eu
          # Several real-herdr-gated E2E scripts require treehouse for spawn
          # worktree acquisition (presentation, workspace-per-home, autodetect).
          bin/fm-install-treehouse.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Assert Herdr pin and protocol floor
        run: |
          set -eu
          command -v herdr >/dev/null || { echo "::error::herdr not on PATH after install"; exit 1; }
          command -v treehouse >/dev/null || { echo "::error::treehouse not on PATH after install"; exit 1; }
          herdr --version
          treehouse --version
          status=$(herdr status --json)
          printf '%s\n' "$status"
          version=$(printf '%s' "$status" | jq -r '.client.version // empty')
          protocol=$(printf '%s' "$status" | jq -r '.client.protocol // empty')
          [ "$version" = "0.7.4" ] || {
            echo "::error::expected exact Herdr pin 0.7.4, got ${version:-<empty>}"
            exit 1
          }
          case "$protocol" in
            ''|*[!0-9]*) echo "::error::could not read client protocol"; exit 1 ;;
          esac
          [ "$protocol" -ge 16 ] || {
            echo "::error::herdr protocol $protocol is below the required floor 16"
            exit 1
          }
      - name: Start default Herdr session for fleet-state tripwire
        run: |
          set -eu
          # Lab provision requires exactly one running default session so the
          # default-session tripwire can arm. Start it headless; never use it
          # for lab work (tests still refuse default and use fm-lab-* only).
          mkdir -p "$RUNNER_TEMP/fm-herdr"
          nohup herdr server >"$RUNNER_TEMP/fm-herdr/default-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/fm-herdr/default-server.pid"
          attempt=0
          while [ "$attempt" -lt 150 ]; do
            running=$(herdr status --json 2>/dev/null | jq -r '.server.running // false' || echo false)
            if [ "$running" = true ]; then
              herdr session list --json | jq -e '
                [.sessions[]? | select(.default == true and .name == "default" and .running == true)]
                | length == 1
              ' >/dev/null
              echo "default Herdr session is running"
              exit 0
            fi
            sleep 0.2
            attempt=$((attempt + 1))
          done
          echo "::error::default Herdr server did not become ready"
          cat "$RUNNER_TEMP/fm-herdr/default-server.log" || true
          exit 1
      - name: Snapshot pre-suite Herdr sessions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-herdr"
          bin/fm-herdr-ci-cleanup.sh snapshot "$RUNNER_TEMP/fm-herdr/sessions-before.json"
      - name: Run real-Herdr family (serial, required)
        # Comfortably above the ~7 min healthy wall and far below the 75 min
        # job backstop. A hang must fail this step so cleanup still runs.
        timeout-minutes: 20
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          # Serial only. Fail if any script reports herdr not found. Live
          # harness credential tests stay outside this family (opt-in env only).
          bin/fm-test-run.sh --family real-herdr-gated \
            --fail-on-gate-skip 'herdr not found' \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-herdr.json"
      - name: Cleanup job-owned Herdr lab sessions
        if: always()
        run: |
          set -eu
          bin/fm-herdr-ci-cleanup.sh teardown "$RUNNER_TEMP/fm-herdr/sessions-before.json" || {
            echo "::warning::lab session cleanup reported a problem; see logs"
            # Surface diagnostics without weakening the suite result above.
            herdr session list --json || true
            exit 1
          }
      # One path, so the artifact's root is the directory holding the JSON and
      # the file lands at the root under the name the aggregate looks up. A
      # second path under another parent would root the artifact at the least
      # common ancestor and nest the JSON one directory down, where the
      # aggregate's flat lookup cannot see it. Diagnostics therefore travel in
      # their own artifact below, not alongside the timing JSON.
      - name: Upload Herdr timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-herdr
          path: ${{ runner.temp }}/fm-test/fm-test-timing-herdr.json
          if-no-files-found: warn
      # Named outside the fm-test-timing-* family on purpose: the aggregate
      # downloads that pattern, and these files are for a human reading the run.
      - name: Upload Herdr diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-herdr-diagnostics
          path: |
            ${{ runner.temp }}/fm-herdr/sessions-before.json
            ${{ runner.temp }}/fm-herdr/default-server.log
          if-no-files-found: warn

  # Aggregate per-lane timing into one summary artifact for critical-path review.
  #
  # WHAT THIS LANE IS A VERDICT ABOUT, because the two halves are different and
  # conflating them is what produced the hole below. It is NOT a verdict about
  # the suites: a failing test is reported by the lane that ran it, and this job
  # says nothing about it. It IS a verdict about its own producer/consumer
  # contract - every lane that uploads a timing artifact has one downloaded and
  # aggregated here. That half gates, and it gates out loud.
  #
  # It used to do neither. The aggregate step globbed whatever arrived and
  # exited 0 on an empty glob with a `::warning::`, so the job was green after
  # aggregating one lane of eleven, and green again after aggregating none at
  # all - indistinguishable, from outside, from a complete aggregate. The
  # consumer had no producer set to compare against, so a renamed or unuploaded
  # artifact silently shrank the data instead of failing. The cost is not
  # hypothetical: the shard-3 comment above records a wholesale shard rebalance
  # still blocked on one timing artifact that went missing, noticed only by a
  # human reading logs.
  #
  # bin/fm-test-run.sh --list-timing-artifacts is that producer set, held there
  # with PORTABLE_SERIAL_SHARDS rather than re-spelled here, and
  # tests/fm-test-run.test.sh holds this file's upload steps to it.
  #
  # A lane cancelled by its own cap uploads nothing, so this job reds too,
  # naming the missing lane next to the lane's own red. That is a second report
  # of one problem, accepted deliberately: the alternative is a rule that
  # exempts missing artifacts whenever any lane is unhealthy, which is exactly
  # when a real naming break would hide inside the exemption.
  tests-timing-aggregate:
    name: Behavior timing aggregate
    runs-on: ubuntu-latest
    needs:
      - tests-portable-parallel-1
      - tests-portable-parallel-2
      - tests-portable-serial
      - tests-herdr
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Download lane timing artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fm-test-timing-*
          path: ${{ runner.temp }}/fm-test-aggregate
          merge-multiple: true
      # Aggregates what arrived and fails only on an artifact it cannot read.
      # Which lanes were owed is the next step's question, so a partial run
      # still publishes the partial summary below before that verdict lands.
      #
      # The inputs are named by the same authoritative set the next step gates
      # on, not by a glob over the download directory. The download pattern
      # necessarily matches this job's own `fm-test-timing-aggregate`, and a
      # re-run of a failed attempt leaves the previous attempt's copy in that
      # directory, so a glob would feed the published summary back in as a
      # twelfth lane and double every count in it.
      - name: Build aggregate timing summary from the artifacts that arrived
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          # An expected set this step could not establish is not an empty
          # expected set: refuse rather than aggregate nothing.
          expected=$(bin/fm-test-run.sh --list-timing-artifacts)
          [ -n "$expected" ] || {
            echo "::error::bin/fm-test-run.sh --list-timing-artifacts named no" \
              "lane, so this step cannot tell which artifacts belong in the" \
              "aggregate. Fix the runner before trusting this lane."
            exit 1
          }
          inputs=()
          while IFS= read -r artifact; do
            [ -n "$artifact" ] || continue
            candidate="$RUNNER_TEMP/fm-test-aggregate/$artifact.json"
            # A lane that owed an artifact and did not deliver one is the next
            # step's verdict, so skip it here and still publish the partial.
            if [ -f "$candidate" ]; then
              inputs+=("$candidate")
            fi
          done <<EOF
          $expected
          EOF
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "No per-lane timing JSON arrived; the completeness check below"
            echo "names every lane that owed one."
            exit 0
          fi
          bin/fm-test-run.sh --aggregate-json \
            "$RUNNER_TEMP/fm-test/fm-test-timing-aggregate.json" \
            "${inputs[@]}"
      - name: Upload aggregate timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-aggregate
          path: ${{ runner.temp }}/fm-test/fm-test-timing-aggregate.json
          if-no-files-found: warn
      # The gating half. Runs even when the step above failed, so a corrupt
      # artifact and a missing one are both named in the same job.
      - name: Require a timing artifact from every lane
        if: always()
        run: |
          set -eu
          # An expected set this step could not establish is not an empty
          # expected set: refuse rather than pass over every lane at once.
          expected=$(bin/fm-test-run.sh --list-timing-artifacts)
          [ -n "$expected" ] || {
            echo "::error::bin/fm-test-run.sh --list-timing-artifacts named no" \
              "lane, so this step cannot tell a complete aggregate from an" \
              "empty one. Fix the runner before trusting this lane."
            exit 1
          }
          missing=0
          while IFS= read -r artifact; do
            [ -n "$artifact" ] || continue
            if [ ! -f "$RUNNER_TEMP/fm-test-aggregate/$artifact.json" ]; then
              echo "::error::lane timing artifact $artifact.json never arrived"
              missing=$((missing + 1))
            fi
          done <<EOF
          $expected
          EOF
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing lane timing artifact(s) missing. A red lane" \
              "above is the usual cause and is reported there; a green fleet" \
              "with a missing artifact means a producer and this consumer" \
              "disagree about the name."
            exit 1
          fi
          echo "Every lane named by --list-timing-artifacts contributed timing."

  macos-stock-bash:
    name: Stock macOS Bash snapshot compatibility
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run snapshot consumers with stock Bash
        shell: /bin/bash {0}
        env:
          PATH: /bin:/usr/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin
        run: |
          set -eu
          case "$BASH_VERSION" in
            3.2.57*) ;;
            *) echo "::error::expected stock macOS Bash 3.2.57, got $BASH_VERSION"; exit 1 ;;
          esac
          /bin/bash --version | head -1
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }

          shell_inventory="$RUNNER_TEMP/fm-shell-inventory"
          bin/fm-lint.sh --list-files > "$shell_inventory"
          parse_fail=0
          while IFS= read -r f; do
            /bin/bash -n "$f" || { echo "::error::stock macOS Bash 3.2 failed to parse $f"; parse_fail=1; }
          done < "$shell_inventory"
          [ "$parse_fail" -eq 0 ] || { echo "::error::stock macOS Bash 3.2 parse sweep failed"; exit 1; }

          # Three independent guards, each with its own message, because each
          # catches what the others cannot:
          #
          #   status  - the suite exited clean. Capture it instead of letting
          #             `set -e` end the step at the command substitution: that
          #             path threw the captured output away before printing it,
          #             so a test failing only under stock Bash 3.2 reached this
          #             log with no `not ok` line and no failing test named, and
          #             this job is the matrix's only 3.2 signal.
          #   marker  - the suite ran to its end. Each script prints
          #             `# fm-test-complete <name>` as its own last statement, so
          #             a premature `exit 0` (the jq skip guard is one such path)
          #             or a run that dies partway is caught even at exit 0.
          #   count   - no test was silently DELETED. The marker still prints for
          #             a suite that lost a case, and the Test coverage guard job
          #             checks file partitioning, not per-suite counts, so this is
          #             the only check that sees a removed test. It has to be
          #             bumped here when a case is added, which is the price of
          #             that coverage.
          run_stock_bash_suite() { # <script> <label> <expected-ok-count>
            local script=$1 label=$2 expected=$3 output status=0 count
            output=$(/bin/bash "$script") || status=$?
            printf '%s\n' "$output"
            [ "$status" -eq 0 ] || {
              echo "::error::$label tests failed under stock macOS Bash 3.2 (exit $status)"
              return 1
            }
            printf '%s\n' "$output" \
              | grep -Fqx "# fm-test-complete $(basename "$script")" || {
              echo "::error::$label tests stopped before the end of the suite under stock macOS Bash 3.2"
              return 1
            }
            count=$(printf '%s\n' "$output" | grep -c '^ok - ' || true)
            [ "$count" -eq "$expected" ] || {
              echo "::error::expected $expected $label tests, got $count"
              return 1
            }
          }

          run_stock_bash_suite tests/fm-fleet-snapshot-view.test.sh snapshot/fleet-view 21
          run_stock_bash_suite tests/fm-bearings-snapshot.test.sh Bearings 60

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compatibility pointers must stay intact
        run: |
          set -eu
          [ ! -L CLAUDE.md ] || { echo "::error::CLAUDE.md must be a real @AGENTS.md pointer file, not a symlink"; exit 1; }
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          printf '%s\n' \
            '<!-- Points Claude at AGENTS.md via import; edit AGENTS.md, not this file. -->' \
            '@AGENTS.md' >"$tmp"
          cmp -s CLAUDE.md "$tmp" || { echo "::error::CLAUDE.md must be the canonical @AGENTS.md pointer"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      # The toolbelt reference is a list a reader trusts, and nothing used to
      # hold it to bin/: it had already lost a row by the time this step was
      # written. Single owner of the row contract and of what counts as drift.
      - name: The bin/ toolbelt reference must match bin/
        run: bin/fm-scripts-inventory-check.sh
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
